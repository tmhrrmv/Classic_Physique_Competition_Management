extension=pdo_mysql

; Sesiones gestionadas por DbSessionHandler (MySQL) — los valores de
; save_handler y save_path se sobreescriben en PHP via session_set_save_handler()
session.gc_maxlifetime = 7200
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
